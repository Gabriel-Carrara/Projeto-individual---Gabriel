<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Strive Stats | Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css">

</head>

<body onload="hourChange()">

   

    <div class="app-container">

        <aside class="sidebar">

            <h2>STRIVE DASH</h2>

            <nav>

                <a href="dashboard.html">DASHBOARD</a>

                <a href="../personagens/personagens.html">PERSONAGENS</a>

                <a href="../index.html">SAIR</a>

            </nav>

        </aside>



        <main class="main-content">

            <header>

              <span class="saudacao">

                  <span id="greetings"></span> <span id="b_usuario">usuário</span>!

              </span>  

            </header>

           

            <div class="kpi-grid">

                <div class="kpi-card">

                    <h3>PERSONAGEM ATUAL</h3>

                    <p id="b_personagem">SOL BADGUY</p>

                </div>

                <div class="kpi-card">

                    <h3>VOTOS TOTAIS</h3>

                    <p id="b_tentativas">247</p>

                </div>

            </div>



            <div class="chart-container">

                <h2>POPULARIDADE DOS PERSONAGENS</h2>

                <div class="chart-wrapper">

                    <canvas id="graficoPersonagens"></canvas>

                </div>

            </div>

        </main>

    </div>



    <script>

        

        b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

        b_personagem.innerHTML = sessionStorage.NOME_PERSONAGEM;

        b_tentativas.innerHTML = sessionStorage.QUANTIDADE_TENTATIVAS;

        let b_personagem = Document.getElementById('b_personagem')



        function quiz_character_update() {

        alterarTitulo(idAquario)

        if (proximaAtualizacao != undefined) {
            clearTimeout(proximaAtualizacao);
        }

        fetch(`/medidas/ultimas/${idAquario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();

                    plotarGrafico(resposta, idAquario);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }


    
    
            const personagens = [];
    
            
    
            const votos = [];






        const ctx = document.getElementById('graficoPersonagens').getContext('2d');








       



        new Chart(ctx, {

            type: 'bar',

            data: {

                labels: personagens,

                datasets: [{

                    label: 'Votos',

                    data: votos,

                    backgroundColor: 'rgba(255, 0, 43, 0.7)',

                    borderColor: '#ff002b',

                    borderWidth: 2

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                scales: {

                    y: {

                        beginAtZero: true,

                        max: 30,

                        grid: { color: '#333' },

                        ticks: { color: '#fff', font: { family: 'Impact' } }

                    },

                    x: {

                        grid: { display: false },

                        ticks: {

                            color: '#fff',

                            font: { family: 'Impact', size: 12},

                            maxRotation: 0,

                            minRotation: 0

                        }

                    }

                },



            }

        });



 function hourChange() {

            let horas = new Date().getHours()

            if(horas>=18){

                greetings.innerHTML='Boa noite,'

            } else if (horas>=12){

                greetings.innerHTML='Boa tarde,'

            } else {

                greetings.innerHTML='Bom dia,'

            }



        }

</script>
